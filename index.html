<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChuniTools Has Moved</title>
    <link rel="icon" type="image/png" href="./imgs/256256_transparent.png" />
    <link rel="apple-touch-icon" href="./imgs/256256_transparent.png" />
    <style>
        :root {
            --bg: #f6f1e8;
            --bg-strong: #eee5d7;
            --panel: rgba(255, 251, 245, 0.88);
            --text: #241d17;
            --muted: #6e655b;
            --line: rgba(73, 54, 28, 0.12);
            --shadow: 0 18px 44px rgba(71, 46, 15, 0.1);
            --accent: #e16b2d;
            --font-display: "Trebuchet MS", "Segoe UI", sans-serif;
            --font-body: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background:
                radial-gradient(circle at top left, rgba(225, 107, 45, 0.14), transparent 26%),
                radial-gradient(circle at top right, rgba(24, 140, 124, 0.12), transparent 22%),
                linear-gradient(180deg, var(--bg), var(--bg-strong));
            color: var(--text);
            font-family: var(--font-body);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(133, 108, 71, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(133, 108, 71, 0.06) 1px, transparent 1px);
            background-size: 34px 34px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.4), transparent 85%);
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
        }

        a:hover {
            text-decoration: underline;
        }

        .wrap {
            width: min(100%, 440px);
            display: grid;
            justify-items: center;
            gap: 14px;
        }

        .logo {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .card {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: var(--panel);
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
            padding: 24px 22px;
            text-align: center;
        }

        h1 {
            margin: 0 0 16px;
            font-family: var(--font-display);
            font-size: clamp(28px, 6vw, 38px);
            line-height: 1;
            letter-spacing: -0.03em;
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
            text-wrap: pretty;
        }

        p + p {
            margin-top: 14px;
        }
    </style>
</head>
<body>
    <main class="wrap">
        <img class="logo" src="./imgs/256256_transparent.png" alt="ChuniMaru logo" />
        <section class="card">
            <h1>We moved</h1>
            <p>ChuniTools has rebranded to ChuniMaru and moved. Please continue at <a href="https://chunimaru.fuwamofu.net/">https://chunimaru.fuwamofu.net/</a>.</p>
            <p>ChuniTools는 ChuniMaru로 리브랜딩되어 이전했습니다. 이제 <a href="https://chunimaru.fuwamofu.net/">https://chunimaru.fuwamofu.net/</a> 를 이용해 주세요.</p>
        </section>
    </main>
</body>
</html>
